# ==============================================================================
# PassiveSentinel Feature Dictionary (Table 3 from paper)
# ==============================================================================

version: "1.0"
description: "Passive, streaming feature dictionary across common flow and 6 threat families."

mathematical_formulations:
  normalized_shannon_entropy:
    formula: "H_norm(X) = - sum_i (p_i * log2(p_i)) / log2(N)"
    definition: "p_i = count(x_i) / total, N = distinct values. Range [0.0, 1.0]."
  coefficient_of_variation_iat:
    formula: "CV(IAT) = std(dt) / (mean(dt) + 1e-6)"
    definition: "Ratio of standard deviation of inter-arrival time to mean inter-arrival time."
  inbound_outbound_ratio:
    formula: "ratio_io = log((bytes_out + 1) / (bytes_in + 1))"
    definition: "Log ratio of egress bytes to ingress bytes with unit smoothing."

feature_groups:
  common_flow:
    window: "per flow"
    key: "canonical 5-tuple (src_ip, dst_ip, src_port, dst_port, protocol)"
    description: "Flow-level base behavioral features extracted on flow completion or timeout."
    features:
      - name: "duration"
        type: "float"
        unit: "seconds"
        description: "Flow lifespan in seconds"
        scaling: "log1p_robust"
      - name: "fwd_packets"
        type: "integer"
        description: "Forward packets count"
        scaling: "log1p_robust"
      - name: "bwd_packets"
        type: "integer"
        description: "Backward packets count"
        scaling: "log1p_robust"
      - name: "fwd_bytes"
        type: "integer"
        description: "Forward bytes count"
        scaling: "log1p_robust"
      - name: "bwd_bytes"
        type: "integer"
        description: "Backward bytes count"
        scaling: "log1p_robust"
      - name: "packet_size_mean"
        type: "float"
        description: "Mean packet size in bytes"
        scaling: "robust"
      - name: "packet_size_std"
        type: "float"
        description: "Standard deviation of packet sizes"
        scaling: "robust"
      - name: "packet_size_min"
        type: "float"
        description: "Minimum observed packet size"
        scaling: "robust"
      - name: "packet_size_max"
        type: "float"
        description: "Maximum observed packet size"
        scaling: "robust"
      - name: "iat_mean"
        type: "float"
        unit: "seconds"
        description: "Mean packet inter-arrival time"
        scaling: "log1p_robust"
      - name: "iat_std"
        type: "float"
        unit: "seconds"
        description: "Standard deviation of packet inter-arrival times"
        scaling: "log1p_robust"
      - name: "syn_count"
        type: "integer"
        description: "Count of packets with SYN flag"
        scaling: "log1p_robust"
      - name: "ack_count"
        type: "integer"
        description: "Count of packets with ACK flag"
        scaling: "log1p_robust"
      - name: "fin_count"
        type: "integer"
        description: "Count of packets with FIN flag"
        scaling: "log1p_robust"
      - name: "rst_count"
        type: "integer"
        description: "Count of packets with RST flag"
        scaling: "log1p_robust"
      - name: "psh_count"
        type: "integer"
        description: "Count of packets with PSH flag"
        scaling: "log1p_robust"
      - name: "protocol"
        type: "categorical"
        values: ["TCP", "UDP", "ICMP", "OTHER"]
        encoding: "one_hot"
      - name: "port_class"
        type: "categorical"
        values: ["well_known", "registered", "ephemeral"]
        encoding: "one_hot"
      - name: "bytes_per_packet"
        type: "float"
        description: "Average bytes per packet (total_bytes / total_packets)"
        scaling: "robust"
      - name: "packets_per_second"
        type: "float"
        description: "Packet rate across flow duration"
        scaling: "log1p_robust"

  ddos:
    window: "1 s per destination"
    key: "destination IP"
    description: "Volumetric, SYN flood and amplification observables over 1-second destination windows."
    features:
      - name: "pps"
        type: "float"
        description: "Packets per second observed toward destination"
        scaling: "log1p_robust"
      - name: "bps"
        type: "float"
        description: "Bytes per second observed toward destination"
        scaling: "log1p_robust"
      - name: "new_flow_rate"
        type: "float"
        description: "Rate of newly initiated flows per second"
        scaling: "log1p_robust"
      - name: "distinct_sources_hll"
        type: "integer"
        description: "HyperLogLog cardinality estimate of unique source IPs"
        scaling: "log1p_robust"
      - name: "h_norm_source_ip"
        type: "float"
        description: "Normalized Shannon entropy of source IPs (0 = concentrated, 1 = uniform spoofed)"
        scaling: "none_bounded"
      - name: "syn_share"
        type: "float"
        description: "Ratio of SYN packets to total packets in window"
        scaling: "none_bounded"
      - name: "syn_without_ack_share"
        type: "float"
        description: "Ratio of naked SYNs without corresponding completing ACK"
        scaling: "none_bounded"
      - name: "unsolicited_reflector_share"
        type: "float"
        description: "Fraction of traffic from known UDP reflector ports (53, 123, 161, 389, 1900, 11211)"
        scaling: "none_bounded"
      - name: "response_request_size_ratio"
        type: "float"
        description: "Mean ratio of response packet size to request packet size (amplification factor)"
        scaling: "robust"
      - name: "ttl_variance"
        type: "float"
        description: "Variance of observed IP TTL header values (indicates spoofed/multi-path flood)"
        scaling: "robust"
      - name: "small_packet_share"
        type: "float"
        description: "Proportion of packets <= 128 bytes (indicates volumetric flooding)"
        scaling: "none_bounded"

  port_scan:
    window: "10 s per source"
    key: "source IP"
    description: "Horizontal, vertical, and block reconnaissance metrics over 10-second source windows."
    features:
      - name: "distinct_dst_ports"
        type: "integer"
        description: "Distinct destination ports contacted (vertical scan indicator)"
        scaling: "log1p_robust"
      - name: "distinct_dst_hosts"
        type: "integer"
        description: "Distinct destination IPs contacted (horizontal scan indicator)"
        scaling: "log1p_robust"
      - name: "fan_out_ratio"
        type: "float"
        description: "Ratio of distinct destination ports to total flows (ports / flows)"
        scaling: "none_bounded"
      - name: "failed_conn_ratio"
        type: "float"
        description: "Ratio of flows terminating in RST or generating ICMP unreachable"
        scaling: "none_bounded"
      - name: "mean_bytes_per_flow"
        type: "float"
        description: "Average bytes per flow (scans typically exhibit tiny probe sizes)"
        scaling: "log1p_robust"
      - name: "sequential_port_fraction"
        type: "float"
        description: "Proportion of probed ports that are consecutive"
        scaling: "none_bounded"
      - name: "h_norm_dst_port"
        type: "float"
        description: "Normalized entropy of destination ports"
        scaling: "none_bounded"

  beaconing:
    window: "30 min per (src, dst, port)"
    key: "(source IP, destination IP, destination port)"
    description: "Autocorrelation, FFT spectral analysis, and timing regularity over expanding history."
    features:
      - name: "event_count"
        type: "integer"
        description: "Total heartbeat events in window (min 8 required for scoring)"
        scaling: "log1p_robust"
      - name: "median_iat"
        type: "float"
        unit: "seconds"
        description: "Median inter-arrival time between consecutive events"
        scaling: "log1p_robust"
      - name: "cv_iat"
        type: "float"
        description: "Coefficient of variation of IAT (rigid beacon has CV near 0)"
        scaling: "robust"
      - name: "mad_iat_over_median"
        type: "float"
        description: "Median Absolute Deviation of IAT divided by median IAT"
        scaling: "robust"
      - name: "dominant_fft_freq"
        type: "float"
        unit: "Hz"
        description: "Frequency corresponding to the maximum spectral density in discrete FFT"
        scaling: "robust"
      - name: "dominant_fft_power_share"
        type: "float"
        description: "Ratio of power in dominant FFT peak to total spectral energy"
        scaling: "none_bounded"
      - name: "autocorr_peak"
        type: "float"
        description: "Peak normalized autocorrelation coefficient at dominant lag"
        scaling: "none_bounded"
      - name: "cv_bytes_per_event"
        type: "float"
        description: "Coefficient of variation of bytes transferred per event"
        scaling: "robust"
      - name: "series_length"
        type: "float"
        unit: "seconds"
        description: "Total timespan spanned by event series"
        scaling: "log1p_robust"

  dns_dga_tunnel:
    window: "per query; per (host, apex) 60 s"
    key: "query name / (host, apex domain)"
    description: "Lexical character CNN inputs and behavioral DNS tunneling metrics."
    features:
      - name: "name_length"
        type: "integer"
        description: "Total character count of domain name"
        scaling: "robust"
      - name: "label_count"
        type: "integer"
        description: "Number of dot-separated labels"
        scaling: "robust"
      - name: "longest_label"
        type: "integer"
        description: "Length of the longest label in the name"
        scaling: "robust"
      - name: "h_norm_chars"
        type: "float"
        description: "Normalized Shannon entropy of character distribution in registered domain"
        scaling: "none_bounded"
      - name: "digit_ratio"
        type: "float"
        description: "Proportion of numerical digits in domain string"
        scaling: "none_bounded"
      - name: "consonant_run_ratio"
        type: "float"
        description: "Ratio of consecutive consonants to total characters"
        scaling: "none_bounded"
      - name: "ngram_log_likelihood"
        type: "float"
        description: "Log-likelihood under benign character n-gram language model"
        scaling: "robust"
      - name: "record_type"
        type: "categorical"
        values: ["A", "AAAA", "TXT", "NULL", "CNAME", "OTHER"]
        encoding: "one_hot"
      - name: "response_size"
        type: "integer"
        description: "Size of DNS response payload in bytes"
        scaling: "log1p_robust"
      - name: "nxdomain_ratio"
        type: "float"
        description: "Proportion of queries resulting in NXDOMAIN response"
        scaling: "none_bounded"
      - name: "distinct_subdomains_per_apex"
        type: "integer"
        description: "Number of distinct subdomains queried under the apex domain in 60 s"
        scaling: "log1p_robust"
      - name: "query_rate_per_apex"
        type: "float"
        description: "Queries per second targeting the apex domain"
        scaling: "log1p_robust"

  tls_quic:
    window: "per session"
    key: "session 5-tuple"
    description: "Metadata-only cleartext TLS handshake and packet sequence features (no decryption)."
    features:
      - name: "ja3_ja4_hash"
        type: "categorical"
        description: "Fingerprint hash (frequency-capped embedding, seen < 5 -> UNKNOWN)"
        encoding: "frequency_capped_embedding"
      - name: "tls_version"
        type: "categorical"
        values: ["TLS1.0", "TLS1.1", "TLS1.2", "TLS1.3", "QUIC", "UNKNOWN"]
        encoding: "one_hot"
      - name: "cipher_count"
        type: "integer"
        description: "Number of advertised client cipher suites"
        scaling: "robust"
      - name: "extension_count"
        type: "integer"
        description: "Number of advertised TLS extensions"
        scaling: "robust"
      - name: "alpn"
        type: "categorical"
        values: ["http/1.1", "h2", "h3", "UNKNOWN"]
        encoding: "one_hot"
      - name: "sni_present"
        type: "binary"
        description: "Whether Server Name Indication is present (0 or 1)"
        scaling: "binary"
      - name: "sni_length"
        type: "integer"
        description: "Length of SNI string"
        scaling: "robust"
      - name: "sni_entropy"
        type: "float"
        description: "Normalized Shannon entropy of SNI domain"
        scaling: "none_bounded"
      - name: "first_32_packets"
        type: "sequence"
        shape: [32, 3]
        description: "First 32 packets as (signed_size / MTU, log1p_iat_ms, direction_sign)"
      - name: "handshake_duration"
        type: "float"
        unit: "seconds"
        description: "Elapsed duration of initial cleartext handshake"
        scaling: "log1p_robust"
      - name: "session_byte_ratio"
        type: "float"
        description: "Inbound to outbound byte ratio of the session"
        scaling: "none_bounded"

  exfiltration:
    window: "60 s per internal host"
    key: "internal host IP"
    description: "Asymmetric outbound volume and destination deviation over 60-second host windows."
    features:
      - name: "ratio_io"
        type: "float"
        description: "Log ratio of egress bytes to ingress bytes: log((bytes_out+1)/(bytes_in+1))"
        scaling: "robust"
      - name: "outbound_bytes_first_seen"
        type: "integer"
        description: "Bytes transmitted to external destinations never before seen in host history"
        scaling: "log1p_robust"
      - name: "share_bytes_top_dst"
        type: "float"
        description: "Fraction of host egress bytes directed to a single external IP"
        scaling: "none_bounded"
      - name: "upload_session_duration"
        type: "float"
        unit: "seconds"
        description: "Duration of longest active outbound session"
        scaling: "log1p_robust"
      - name: "zscore_outbound_bytes_ewma"
        type: "float"
        description: "Z-score of current window outbound bytes relative to host EWMA historical baseline"
        scaling: "robust"
      - name: "burst_vs_sustained_index"
        type: "float"
        description: "Ratio of peak 1-second egress bytes to average 60-second egress bytes"
        scaling: "robust"
