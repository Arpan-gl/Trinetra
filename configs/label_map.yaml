# ==============================================================================
# PassiveSentinel Unified Threat Taxonomy Label Map
# Standardizes all raw dataset labels to the 7 canonical classes:
# [benign, ddos, beaconing, dga_tunnel, encrypted_malware, recon_scan, exfiltration]
# ==============================================================================

version: "1.0"

canonical_classes:
  0: "benign"
  1: "ddos"
  2: "beaconing"
  3: "dga_tunnel"
  4: "encrypted_malware"
  5: "recon_scan"
  6: "exfiltration"

class_to_id:
  benign: 0
  ddos: 1
  beaconing: 2
  dga_tunnel: 3
  encrypted_malware: 4
  recon_scan: 5
  exfiltration: 6

